version: "3.1"

# These dialogue tests characterize ownership after a validator rejects a
# subject. The validator clears materia; the same form remains active and asks
# for materia again before a corrected canonical value can submit the form.
stories:
  - story: 010 attendance invalid subject stays in form
    steps:
      - slot_was_set:
          - is_authenticated: true
          - matricula: "66001"
      - intent: consultar_asistencia
      - action: asistencia_form
      - active_loop: asistencia_form
      - slot_was_set:
          - requested_slot: materia
      - intent: proporcionar_materia
        entities:
          - materia: "Materia inexistente"
      - action: asistencia_form
      - active_loop: asistencia_form
      - slot_was_set:
          - materia: null
          - requested_slot: materia
      - intent: proporcionar_materia
        entities:
          - materia: "Física II"
      - action: asistencia_form
      - active_loop: null
      - slot_was_set:
          - requested_slot: null
      - action: action_consultar_asistencia

