version: "3.1"

stories:
  - story: grades A request with subject already present
    steps:
      - slot_was_set:
          - is_authenticated: true
          - matricula: "66001"
          - materia: "Física I"
      - user: |
          ¿Qué nota tengo en [Física](materia)?
        intent: consultar_notas
      - action: notas_form
      - active_loop: null
      - slot_was_set:
          - requested_slot: null
      - action: action_consultar_notas

  - story: grades B missing subject asks and keeps flow active
