  - autenticar_usuario
  - consultar_asistencia
  - afirmacion
  - negacion
  - consultar_fecha_mesas_examen_final
  - consultar_materias
  - consultar_notas
  - consultar_requerimientos_materia
  - contactos
  - curso_ingreso
  - despedida
  - evaluacion_coneau
  - informar_asistencia
  - informar_ayuda_informatica_ingles
  - informar_becas_hermanos
  - informar_equipamiento_tecnologico
  - informar_equivalencias
  - informar_examen_recuperatorio
  - informar_horarios_trabajadores
  - informar_intercambio_de_estudio
  - informar_modalidad_inscripcion
  - informar_nivel_profesores
  - informar_servicios
  - inscribirse_mesa_examen
  - cancelar_inscripcion_mesa_examen
  - nlu_fallback
